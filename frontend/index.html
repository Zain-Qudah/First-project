<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='none' stroke='currentColor' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' d='M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5v-9Z M4 9h13.5A2.5 2.5 0 0 1 20 11.5v3H16a2.5 2.5 0 0 1 0-5h4 M16 11.5h1'/%3E%3C/svg%3E"
/>
    
 
</head>



<body>
  <main>
     <!-- Navbar -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <span class="navbar-brand mb-0 h1">
                Expense Tracker
            </span>

            <button id="darkModeButton" class="btn btn-outline-light ms-2" type="button">
                🌙 Dark Mode
            </button>
        </div>


    </nav>



    <div class="container my-4">


        <!-- Error Alert -->

        <div id="errorAlert"
             class="alert alert-danger d-none"
             role="alert">

            Something went wrong.

        </div>



        <!-- Spinner -->

        <div id="spinner"
             class="text-center my-4 d-none">

            <div class="spinner-border"
                 role="status">

                <span class="visually-hidden">
                    Loading...
                </span>

            </div>

        </div>



        <!-- Summary Cards -->

        <div class="summary-cards mb-4">

            <!-- Total -->
    
            <div >

                <div class="card summary-card">

                    <div class="card-body text-center">

                        <h5 class="card-title">
                            Total Amount
                        </h5>

                        <p id="totalAmount"
                           class="fs-3 fw-bold mb-0">
                            0.00
                        </p>

                    </div>

                </div>

            </div>



            <!-- Number -->
           
            <div >

                <div class="card summary-card">

                    <div class="card-body text-center">

                        <h5 class="card-title">
                            Number of Expenses
                        </h5>

                        <p id="expenseCount"
                           class="fs-3 fw-bold mb-0">
                            0
                        </p>

                    </div>

                </div>

            </div>



            <!-- Highest -->
             
            <div >

                <div class="card summary-card">

                    <div class="card-body text-center">

                        <h5 class="card-title">
                            Highest Expense
                        </h5>

                        <p id="highestExpense"
                           class="fs-3 fw-bold mb-0">
                            0.00
                        </p>

                    </div>

                </div>

            </div>

        </div>

        <!-- Expense Chart -->
        
        <div class="card mb-4">
            <div class="card-body">
        
                <h5 class="card-title">
                    Expenses by Category
                </h5>
        
                <canvas id="expenseChart"></canvas>
        
            </div>
        </div>



        <!-- Expense Form -->

        <div class="card mb-4">

            <div class="card-body">

                <h3 class="mb-3">
                    Add Expense
                </h3>


                <form id="expenseForm">


                    <!-- Hidden ID for edit -->

                    <input type="hidden"
                           id="expenseId">



                    <div class="row g-3">


                        <!-- Title -->

                        <div class="col-md-3">

                            <label for="title"
                                   class="form-label">

                                Title

                            </label>


                            <input
                                type="text"
                                id="title"
                                class="form-control"
                                required>

                        </div>



                        <!-- Amount -->

                        <div class="col-md-3">

                            <label for="amount"
                                   class="form-label">

                                Amount

                            </label>


                            <input
                                type="number"
                                id="amount"
                                class="form-control"
                                min="0.01"
                                step="0.01"
                                required>

                        </div>



                        <!-- Category -->

                        <div class="col-md-3">

                            <label for="category"
                                   class="form-label">

                                Category

                            </label>


                            <select
                                id="category"
                                class="form-select"
                                required>

                                <option value="">
                                    Select Category
                                </option>

                                <option value="Food">
                                    Food
                                </option>

                                <option value="Transport">
                                    Transport
                                </option>

                                <option value="Bills">
                                    Bills
                                </option>

                                <option value="Entertainment">
                                    Entertainment
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>



                        <!-- Date -->

                        <div class="col-md-3">

                            <label for="date"
                                   class="form-label">

                                Date

                            </label>


                            <input
                                type="date"
                                id="date"
                                class="form-control"
                                required>

                        </div>

                    </div>



                    <!-- Buttons -->

                    <div class="mt-3">

                        <button
                            type="submit"
                            id="submitButton"
                            class="btn btn-primary">

                            Save Expense

                        </button>


                        <button
                            type="button"
                            id="cancelEdit"
                            class="btn btn-secondary d-none">

                            Cancel Edit

                        </button>

                    </div>


                </form>

            </div>

        </div>



        <!-- Filter -->

        <div class="mb-3">

            <label for="categoryFilter"
                   class="form-label">

                Filter by Category

            </label>


            <select
                id="categoryFilter"
                class="form-select">


                <option value="All">
                    All
                </option>


                <option value="Food">
                    Food
                </option>


                <option value="Transport">
                    Transport
                </option>


                <option value="Bills">
                    Bills
                </option>


                <option value="Entertainment">
                    Entertainment
                </option>


                <option value="Other">
                    Other
                </option>


            </select>

        </div>
        <!-- Search by Title -->
        
        <div class="mb-3">
        
            <label for="titleSearch" class="form-label">
        
                Search by Title
        
            </label>
        
            <input type="text" id="titleSearch" class="form-control" placeholder="Search by title...">
        
        </div>



        <!-- Table -->

        <div class="table-responsive">

            <table class="table table-bordered table-striped">

                <thead class="table-dark">

                    <tr>

                        <th>Title</th>

                        <th>Amount</th>

                        <th>Category</th>

                        <th>Date</th>

                        <th>Edit</th>

                        <th>Delete</th>

                    </tr>

                </thead>


                <tbody id="expensesTableBody">

                    <!-- JavaScript creates the rows -->

                </tbody>

            </table>

        </div>


    </div>
  
    <!-- Edit Expense Modal -->
<div class="modal fade" id="editExpenseModal" tabindex="-1" aria-hidden="true">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Edit Expense
                </h5>

                <button type="button" class="btn-close" data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <form id="editExpenseForm">

                    <input type="hidden" id="editExpenseId">

                    <div class="mb-3">

                        <label class="form-label">
                            Title
                        </label>

                        <input type="text" id="editTitle" class="form-control" required>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Amount
                        </label>

                        <input type="number" id="editAmount" class="form-control" step="0.01" required>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Category
                        </label>

                        <select id="editCategory" class="form-select" required>

                            <option value="Food">
                                Food
                            </option>

                            <option value="Transport">
                                Transport
                            </option>

                            <option value="Bills">
                                Bills
                            </option>

                            <option value="Entertainment">
                                Entertainment
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Date
                        </label>

                        <input type="date" id="editDate" class="form-control" required>

                    </div>

                </form>

            </div>


            <div class="modal-footer">

                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">

                    Cancel

                </button>


                <button type="submit" form="editExpenseForm" class="btn btn-primary">

                    Save Changes

                </button>

            </div>

        </div>

    </div>

</div>
  </main>
 
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
